<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page Not Found | SAROGraphics</title>
  <meta name="description" content="The page you are looking for does not exist or has moved." />
  <meta name="robots" content="noindex" />
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800&family=Archivo+Narrow:wght@700&family=Inter:wght@400&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --lime: #B8CE1F; --magenta: #E23E9A; --bone: #E8E7DF; --ink: #14130F; --muted: #6B6560;
    }
    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--bone); color: var(--ink); min-height: 100vh;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      text-align: center; padding: 2rem;
    }
    .eyebrow { font-family: 'Archivo Narrow', sans-serif; font-size: 0.75rem; font-weight: 700; letter-spacing: 0.35em; color: var(--magenta); text-transform: uppercase; margin-bottom: 1.5rem; }
    h1 { font-family: 'Archivo', sans-serif; font-size: clamp(2rem, 6vw, 3.5rem); font-weight: 800; margin-bottom: 1rem; }
    p { color: var(--muted); font-size: 1rem; margin-bottom: 2.5rem; max-width: 420px; }
    a { font-family: 'Archivo', sans-serif; display: inline-block; background: var(--ink); color: var(--lime); text-decoration: none; font-weight: 800; font-size: 1rem; padding: 0.9rem 2.2rem; transition: background 0.2s, color 0.2s; }
    a:hover { background: var(--magenta); color: var(--bone); }
  </style>
</head>
<body>
  <p class="eyebrow">Error 404</p>
  <h1>Page not found</h1>
  <p>The page you are looking for does not exist or has moved.</p>
  <a href="/">Back to Home</a>
</body>
</html>
