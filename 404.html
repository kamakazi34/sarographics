<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page Not Found | SAROGraphics</title>
  <meta name="description" content="The page you are looking for does not exist or has moved." />
  <meta name="robots" content="noindex" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --navy: #0d1b2a; --orange: #f47c20; --orange-dark: #d46510;
      --white: #ffffff; --light: #f0f4f8; --grey: #8a9ab0;
    }
    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: var(--navy); color: var(--white); min-height: 100vh;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      text-align: center; padding: 2rem;
    }
    .eyebrow { font-size: 0.75rem; font-weight: 700; letter-spacing: 0.35em; color: var(--orange); text-transform: uppercase; margin-bottom: 1.5rem; }
    h1 { font-size: clamp(2rem, 6vw, 3.5rem); font-weight: 800; margin-bottom: 1rem; }
    p { color: var(--grey); font-size: 1rem; margin-bottom: 2.5rem; max-width: 420px; }
    a { display: inline-block; background: var(--orange); color: var(--white); text-decoration: none; font-weight: 800; font-size: 1rem; padding: 0.9rem 2.2rem; border-radius: 5px; transition: background 0.2s; }
    a:hover { background: var(--orange-dark); }
  </style>
</head>
<body>
  <p class="eyebrow">Error 404</p>
  <h1>Page not found</h1>
  <p>The page you are looking for does not exist or has moved.</p>
  <a href="/">Back to Home</a>
</body>
</html>
