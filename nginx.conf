worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;
events { worker_connections 1024; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log /dev/stdout;
  sendfile on;
  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;
  client_body_temp_path /tmp/cbt; proxy_temp_path /tmp/pt; fastcgi_temp_path /tmp/ft;
  uwsgi_temp_path /tmp/ut; scgi_temp_path /tmp/st;
  server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;
    location / { try_files $uri $uri.html $uri/ /index.html; }
    location ~* \.(jpg|jpeg|png|gif|svg|webp|ico|css|js|woff2?)$ {
      expires 7d; add_header Cache-Control "public, max-age=604800";
    }
  }
}
